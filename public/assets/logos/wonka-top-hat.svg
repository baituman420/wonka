<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Hat body gradient (theatrical velvet / deep charcoal with purple undertone) -->
    <linearGradient id="hatBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1845" />
      <stop offset="45%" stop-color="#181024" />
      <stop offset="80%" stop-color="#120B1C" />
      <stop offset="100%" stop-color="#221233" />
    </linearGradient>

    <!-- Velvet crown highlight -->
    <linearGradient id="crownHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#432368" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#623499" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#2A1440" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#150921" stop-opacity="0.8" />
    </linearGradient>

    <!-- Silk Band Gradient (Wonka Ochre Gold & Purple) -->
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#704F17" />
      <stop offset="30%" stop-color="#D4A349" />
      <stop offset="55%" stop-color="#FAF0D4" />
      <stop offset="75%" stop-color="#A37827" />
      <stop offset="100%" stop-color="#593E10" />
    </linearGradient>

    <!-- Buckle gold gradient -->
    <linearGradient id="goldBuckle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0D4" />
      <stop offset="50%" stop-color="#D4A349" />
      <stop offset="100%" stop-color="#8D6A2A" />
    </linearGradient>

    <!-- Brim Underside Depth -->
    <linearGradient id="brimUnderside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120B1C" />
      <stop offset="100%" stop-color="#08040C" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="wonkaHatShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#2E1050" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <g transform="rotate(-7 80 85)" filter="url(#wonkaHatShadow)">
    <!-- Back / Underside curve of the brim -->
    <path d="M22 116 C22 108 48 100 80 100 C112 100 138 108 138 116 C138 123 112 129 80 129 C48 129 22 123 22 116 Z" fill="url(#brimUnderside)" />

    <!-- Hat Crown (Flared top with theatrical concave waist) -->
    <!-- Waist at y=110 (~46 to 114), Crown Top at y=36 (~38 to 122) -->
    <path d="M47 110 
             C44 86 38 56 36 38 
             C48 30 112 30 124 38 
             C122 56 116 86 113 110 
             Z" 
          fill="url(#hatBodyGrad)" 
          stroke="#12081C" 
          stroke-width="1.5" />

    <!-- Crown Top Oval (Dimensional Cap) -->
    <ellipse cx="80" cy="38" rx="44" ry="11" fill="url(#crownHighlight)" stroke="#542A82" stroke-width="1" />
    <!-- Crown top inner depth crease -->
    <ellipse cx="80" cy="37" rx="39" ry="8" fill="#1B0E2A" opacity="0.5" />

    <!-- Soft vertical velvet light reflection on the left crown flank -->
    <path d="M48 40 C49 60 54 85 55 110 C50 110 47 85 45 40 Z" fill="#ffffff" opacity="0.08" />

    <!-- Silk Decorative Ribbon Band -->
    <path d="M46 110 
             C47 101 49 93 49 93 
             C60 97 100 97 111 93 
             C111 93 113 101 114 110 
             C102 115 58 115 46 110 Z" 
          fill="#230C38" 
          stroke="#D4A349" 
          stroke-width="1.2" />

    <!-- Gold Ribbon Trim Accent Layer -->
    <path d="M48.5 98 C62 103 98 103 111.5 98" stroke="url(#bandGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M46.8 106 C62 111 98 111 113.2 106" stroke="url(#bandGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Ornate Art-Déco Gold Buckle on the Band -->
    <g transform="translate(70, 95)">
      <!-- Outer buckle ring -->
      <rect x="0" y="0" width="20" height="15" rx="3" fill="url(#goldBuckle)" stroke="#69470D" stroke-width="0.8" />
      <!-- Inner buckle opening -->
      <rect x="4.5" y="3" width="11" height="9" rx="1.5" fill="#1A072E" />
      <!-- Buckle tongue / prongs -->
      <rect x="9" y="1.5" width="2" height="12" rx="1" fill="#FAF0D4" />
    </g>

    <!-- Theatrical Sweeping Front Brim (curved downward in center, flared at ears) -->
    <path d="M18 117 
             C18 110 46 106 80 106 
             C114 106 142 110 142 117 
             C142 126 114 133 80 133 
             C46 133 18 126 18 117 Z" 
          fill="url(#hatBodyGrad)" 
          stroke="#3D1E60" 
          stroke-width="1.5" />

    <!-- Brim Edge Golden Lip / Reflection -->
    <path d="M24 118 C46 127 114 127 136 118" stroke="url(#bandGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <!-- Fine specular sheen on front brim -->
    <path d="M50 123 C68 128 92 128 110 123" stroke="#FAF0D4" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>